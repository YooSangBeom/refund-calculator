<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>화이트펜슬 환불 계산기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; background:#f5f6f8; padding:20px; }
    .card { max-width:560px; margin:auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,.1); }
    h2 { margin-top:0; }
    label { display:block; margin-top:12px; font-weight:600; }
    select, input { width:100%; padding:8px; margin-top:6px; }
    button { margin-top:20px; width:100%; padding:12px; font-size:16px; border:none; border-radius:8px; background:#2563eb; color:#fff; cursor:pointer; }
    .result { margin-top:16px; padding:12px; background:#f1f5f9; border-radius:8px; font-weight:600; }
    .note { margin-top:12px; font-size:13px; color:#555; }
  .warning-text { color: #d32f2f; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h2>화이트펜슬 환불 계산기</h2>

  <label>이용권 종류</label>
  <select id="type">
    <option value="day">당일권</option>
    <option value="time">시간권</option>
    <option value="period">기간권(고정권)</option>
    <option value="room">스터디룸</option>
    <option value="roomTime">스터디룸 시간권</option>
  </select>

  <label>결제 금액 (원)</label>
  <input type="number" id="price" placeholder="예: 300000" />

  <!-- 시간권 -->
  <div id="timeBox" style="display:none;">
    <label>시간권 종류</label>
    <select id="timeType">
      <option value="30">30시간권</option>
      <option value="50">50시간권</option>
      <option value="100">100시간권</option>
      <option value="200">200시간권</option>
    </select>

    <label>구매일</label>
    <input type="date" id="buyDate" />

    <label>환불 기준일</label>
    <input type="date" id="timeRefundDate" />

    <label>잔여 시간</label>
    <input type="number" id="remainHours" min="0" />
    <div id="remainHelp" style="margin-top:4px;font-size:12px;color:#555;"><span class="warning-text">※ 최종 구매 이용권 구매 이후 사용시간을 제외한 시간을 입력해주세요. (재구매를 통한 이전 만료 이용권의 시간은 환불 대상이 아닙니다)</span></div>
  </div>

  <!-- 기간권 -->
  <div id="periodBox" style="display:none;">
    <label>기간권 종류</label>
    <select id="periodType">
      <option value="14">2주 이용권</option>
      <option value="28">4주 이용권</option>
      <option value="56">8주 이용권</option>
      <option value="84">12주 이용권</option>
    </select>

    <label>시작일</label>
    <input type="date" id="startDate" />

    <label>환불 기준일</label>
    <input type="date" id="periodRefundDate" />
  </div>

  <!-- 스터디룸 -->
  <div id="roomBox" style="display:none;">
    <label>예약일</label>
    <input type="date" id="roomDate" />

    <label>예약 시간</label>
    <div style="display:flex; gap:8px;">
      <select id="roomHour"></select>
      <span>:</span>
      <select id="roomMinute"></select>
    </div>

    <label>환불 기준일</label>
    <input type="date" id="roomBaseDate" />

    <label>환불 기준 시간</label>
    <div style="display:flex; gap:8px;">
      <select id="roomBaseHour"></select>
      <span>:</span>
      <select id="roomBaseMinute"></select>
    </div>
  </div>

  <button onclick="calc()">환불 금액 계산</button>

  <div class="result" id="result">환불 금액: -</div>
  <div class="result" id="reason" style="font-weight:600; font-size:14px; color:#d32f2f;">적용 규정: -</div>

  <div class="note">
    * 당일권은 환불 불가<br>
    * 사용률 50% 이상은 환불 불가<br>
    * 연장으로 합산된 시간은 환불 대상에서 제외됩니다
  </div>
</div>

<script>
// 기본값: 오늘 날짜로 자동 설정
const today = new Date();
const todayStr = today.toISOString().slice(0,10);

['buyDate','timeRefundDate','startDate','periodRefundDate','roomDate','roomBaseDate'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.value = todayStr;
});

const typeEl = document.getElementById('type');
const timeBox = document.getElementById('timeBox');
const periodBox = document.getElementById('periodBox');
const roomBox = document.getElementById('roomBox');
const resultEl = document.getElementById('result');
const reasonEl = document.getElementById('reason');

function fillTimeSelect(hId, mId) {
  const h = document.getElementById(hId);
  const m = document.getElementById(mId);
  for (let i = 0; i < 24; i++) {
    const v = String(i).padStart(2,'0');
    h.innerHTML += `<option value="${v}">${v}</option>`;
  }
  for (let i = 0; i < 60; i += 5) {
    const v = String(i).padStart(2,'0');
    m.innerHTML += `<option value="${v}">${v}</option>`;
  }
}

fillTimeSelect('roomHour','roomMinute');
fillTimeSelect('roomBaseHour','roomBaseMinute');

function hideAll() {
  timeBox.style.display = 'none';
  periodBox.style.display = 'none';
  roomBox.style.display = 'none';
}

typeEl.addEventListener('change', () => {
  hideAll();
  if (typeEl.value === 'day') {
    resultEl.innerText = '환불 금액: 0 원';
    reasonEl.innerText = '적용 규정: 당일권은 환불 불가';
    return;
  }
  if (typeEl.value === 'time' || typeEl.value === 'roomTime') timeBox.style.display = 'block';
  if (typeEl.value === 'period') periodBox.style.display = 'block';
  if (typeEl.value === 'room') roomBox.style.display = 'block';
});

function calc() {
  const type = typeEl.value;
  const price = Number(document.getElementById('price').value);
  let refund = 0;
  let reason = '';

  if (!price || price <= 0) {
    alert('결제 금액을 입력해주세요');
    return;
  }

  if (type === 'day') {
    refund = 0;
    reason = '당일권은 환불 불가';
  }

  if (type === 'time' || type === 'roomTime') {
    const total = Number(document.getElementById('timeType').value);
    const remainInput = document.getElementById('remainHours');
    if (remainInput.value > total) {
      remainInput.value = total;
    }
    const remain = Number(document.getElementById('remainHours').value);
    const buyDate = new Date(document.getElementById('buyDate').value);
    const refundBase = new Date(document.getElementById('timeRefundDate').value);

    if (isNaN(total) || isNaN(remain) || !buyDate || !refundBase) {
      alert('시간권 정보를 모두 입력해주세요');
      return;
    }

    // 환불기한 설정
    const limitMap = { 30: 15, 50: 30, 100: 60, 200: 90 };
    const limitDays = limitMap[total];
    const diffDays = (refundBase - buyDate) / (1000 * 60 * 60 * 24);

    if (diffDays > limitDays) {
      refund = 0;
      reason = `시간권 환불기한 초과 (${limitDays}일) → 환불 불가`;
    } else {
      const usage = ((total - remain) / total) * 100;
      if (usage < 25) {
        refund = price * 0.5;
        reason = '사용률 0% 이상 ~ 25% 미만 → 50% 환불';
      } else if (usage < 50) {
        refund = price * 0.25;
        reason = '사용률 25% 이상 ~ 50% 미만 → 25% 환불';
      } else {
        refund = 0;
        reason = '사용률 50% 이상 → 환불 불가';
      }
    }
  }

  if (type === 'period') {
    const totalDays = Number(document.getElementById('periodType').value);
    const start = new Date(document.getElementById('startDate').value);
    const base = new Date(document.getElementById('periodRefundDate').value);
    const usedDays = (base - start) / (1000*60*60*24);
    const usage = (usedDays / totalDays) * 100;

    if (usage < 25) {
      refund = price * 0.5;
      reason = '기간권 사용률 0% 이상 ~ 25% 미만 → 50% 환불';
    } else if (usage < 50) {
      refund = price * 0.25;
      reason = '기간권 사용률 25% 이상 ~ 50% 미만 → 25% 환불';
    } else {
      refund = 0;
      reason = '기간권 사용률 50% 이상 → 환불 불가';
    }
  }

  if (type === 'room') {
    const rDate = document.getElementById('roomDate').value;
    const rh = document.getElementById('roomHour').value;
    const rm = document.getElementById('roomMinute').value;
    const bDate = document.getElementById('roomBaseDate').value;
    const bh = document.getElementById('roomBaseHour').value;
    const bm = document.getElementById('roomBaseMinute').value;

    const reserve = new Date(`${rDate}T${rh}:${rm}:00`);
    const base = new Date(`${bDate}T${bh}:${bm}:00`);
    const diff = (reserve - base) / (1000*60*60);

    if (diff >= 48) {
      refund = price;
      reason = '스터디룸: 입장 48시간 이전 → 100% 환불';
    } else if (diff >= 24) {
      refund = price * 0.5;
      reason = '스터디룸: 입장 24시간 이전 → 50% 환불';
    } else if (diff >= 6) {
      refund = price * 0.25;
      reason = '스터디룸: 입장 6시간 이전 → 25% 환불';
    } else {
      refund = 0;
      reason = '스터디룸: 입장 6시간 미만 → 환불 불가';
    }
  }

  resultEl.innerText = `환불 금액: ${refund.toLocaleString()} 원`;
  reasonEl.innerText = `적용 규정: ${reason}`;
}
</script>
  <div style="text-align:center; margin-top:20px;">

         alt="환불규정 이미지"
         style="max-width:100%; height:auto; border:1px solid #ddd; border-radius:6px; margin-top:16px;">
  </div>
</body>
</html>
